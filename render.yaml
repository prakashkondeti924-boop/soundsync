services:
  - type: web
    name: soundsync-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_MODE
        value: local

  - type: web
    name: soundsync-client
    runtime: node
    plan: free
    buildCommand: bun install --ignore-scripts && bun run --cwd apps/client build
    startCommand: npm --prefix apps/client run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://soundsync-server.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: wss://soundsync-server.onrender.com/ws
